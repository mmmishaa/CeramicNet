dataset:
  coco_json: ceramic_dataset/annotations/instances_default.json
  images_dir: ceramic_dataset/images
  negatives_dir: ceramic_dataset/negatives
  random_state: 42
  train: 0.8
  val: 0.2

confidence_config:
  conf_threshold: 0.25
  iou_threshold: 0.5

models:
  - name: "yolo26s_without_neg"
    type: "onnx"
    process_file: "test_pipelines/detection_models/detection_configs/yolo_processing.py"
    process_class: "YOLOProcessing"
    weights_path: "train_pipelines/detection_models/model_weights/ceramic_yolo26s_without_neg.onnx"
    imgsz: 640

  - name: "yolo26s_with_neg"
    type: "onnx"
    process_file: "test_pipelines/detection_models/detection_configs/yolo_processing.py"
    process_class: "YOLOProcessing"
    weights_path: "train_pipelines/detection_models/model_weights/ceramic_yolo26s_with_neg.onnx"
    imgsz: 640