top_k: 10

encoder:
  weights: "weights/retrieval_weights/stamp_encoder.onnx"
  input_size: 224
  mean: [0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0]
  num_threads: 4
  enhance_contrast: true

index:
  path: "data/stamp_books_index.npz"

books:
  dir: "data/books"
  meta_csv: "data/books/meta.csv"

preprocessing:
  crop:
    target_size: 224
    padding_ratio: 0.1
    pad_value: 255
  contrast:
    clip_limit: 2.0
    tile_grid_size: [8, 8]
    invert_dark_background: true
    sharpen: false