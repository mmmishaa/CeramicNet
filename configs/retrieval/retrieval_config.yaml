top_k: 10

active_model: "stamp_encoder"

models:
  stamp_encoder:
    encoder:
      weights: "weights/retrieval_weights/stamp_encoder.onnx"
      input_size: 224
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
      num_threads: 4
      enhance_contrast: true
    index:
      path: "data/books_index/stamp_books_index.npz"

  stamp_encoder_v1:
    encoder:
      weights: "weights/retrieval_weights/stamp_encoder_v1.onnx"
      input_size: 224
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
      num_threads: 4
      enhance_contrast: true
    index:
      path: "data/books_index/books_index_stamp_encoder_v1.npz"

  student_encoder:
    encoder:
      weights: "weights/retrieval_weights/student_encoder.onnx"
      input_size: 224
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]
      num_threads: 4
      enhance_contrast: true
    index:
      path: "data/books_index/books_index.npz"

  student_encoder_katya:
    encoder:
      weights: "weights/retrieval_weights/student_encoder_katya.onnx"
      input_size: 224
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]
      num_threads: 4
      enhance_contrast: true
    index:
      path: "data/books_index/books_index_student_encoder_katya.npz"

  encoder_sasha:
    encoder:
      weights: "weights/retrieval_weights/encoder_sasha.onnx"
      input_size: 224
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]
      num_threads: 4
      enhance_contrast: true
    index:
      path: "data/books_index/books_index_encoder_sasha.npz"

books:
  dir: "data/books"
  meta_csv: "data/books/meta.csv"

preprocessing:
  crop:
    target_size: 224
    padding_ratio: 0.1
    pad_value: 255
  contrast:
    clip_limit: 2.0
    tile_grid_size: [8, 8]
    invert_dark_background: true
    sharpen: false