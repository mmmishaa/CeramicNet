dataset:
  coco_json: "ceramic_dataset/annotations/instances_default.json"
  images_dir: "ceramic_dataset/images"
  negatives_dir: "ceramic_dataset/negatives"
  random_state: 42
  train: 0.8
  val: 0.2

confidence_config:
  conf_threshold: 0.75
  iou_threshold: 0.5

detectors:
  yolo26s_v1:
    weights: "weights/detection_weights/yolo26s_v1.onnx"
    imgsz: 640
    processor: "src.detection.yolo_processing.YOLOProcessing"
  
  yolo26s_v2:
    weights: "weights/detection_weights/yolo26s_v2.onnx"
    imgsz: 640
    processor: "src.detection.yolo_processing.YOLOProcessing"